
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#03040c"/>
  <stop offset=".5" stop-color="#17103c"/>
  <stop offset="1" stop-color="#041b34"/>
 </linearGradient>
 <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#22d3ee"/>
  <stop offset=".45" stop-color="#8b5cf6"/>
  <stop offset="1" stop-color="#312e81"/>
 </linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
  <stop stop-color="#22d3ee"/>
  <stop offset=".5" stop-color="#a78bfa"/>
  <stop offset="1" stop-color="#8b5cf6"/>
 </linearGradient>
 <radialGradient id="core">
  <stop stop-color="#c4b5fd"/>
  <stop offset=".35" stop-color="#8b5cf6"/>
  <stop offset="1" stop-color="#09051e"/>
 </radialGradient>
 <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
  <path d="M35 0H0V35" fill="none" stroke="#8b5cf6" stroke-opacity=".18"/>
 </pattern>
 <filter id="glow">
  <feGaussianBlur stdDeviation="7" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
</defs>

<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<rect width="1200" height="430" rx="22" fill="url(#grid)"/>

<!-- perspective floor -->
<g stroke="#8b5cf6" stroke-opacity=".23" fill="none">
 <path d="M0 300L600 190L1200 300"/>
 <path d="M0 340L600 190L1200 340"/>
 <path d="M0 390L600 190L1200 390"/>
 <path d="M100 430L600 190L1100 430"/>
 <path d="M300 430L600 190L900 430"/>
 <path d="M500 430L600 190L700 430"/>
</g>

<!-- floating orbital geometry -->
<g transform="translate(930 190)" fill="none" filter="url(#glow)">
 <ellipse rx="185" ry="75" stroke="#8b5cf6" stroke-width="2" transform="rotate(-28)"/>
 <ellipse rx="165" ry="90" stroke="#22d3ee" stroke-width="1.5" transform="rotate(48)"/>
 <ellipse rx="125" ry="125" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8 9"/>
 <circle r="86" fill="url(#core)" stroke="#a78bfa" stroke-width="2"/>
 <circle r="65" stroke="#22d3ee" stroke-width="2"/>
 <circle r="44" fill="url(#orb)" opacity=".8"/>
 <path d="M-85 0H85M0 -85V85" stroke="#c4b5fd" opacity=".4"/>
</g>

<!-- luminous orbit nodes -->
<g fill="#22d3ee" filter="url(#glow)">
 <circle cx="930" cy="15" r="5"/>
 <circle cx="1110" cy="185" r="5"/>
 <circle cx="770" cy="215" r="4"/>
 <circle cx="970" cy="325" r="4"/>
</g>

<!-- floating particles -->
<g fill="#c4b5fd">
 <circle cx="760" cy="70" r="2"/>
 <circle cx="1090" cy="65" r="3"/>
 <circle cx="1140" cy="280" r="2"/>
 <circle cx="720" cy="320" r="2"/>
 <circle cx="650" cy="115" r="2"/>
</g>

<!-- title -->
<text x="70" y="75" fill="#22d3ee" font-family="monospace" font-size="14" letter-spacing="6">◈ DEVELOPER UNIVERSE / 2026</text>
<text x="70" y="165" fill="#ffffff" font-family="Arial,sans-serif" font-size="51" font-weight="bold">HARSHA VARDHAN</text>
<text x="70" y="220" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="45" font-weight="bold">N J</text>
<path d="M70 245H570" stroke="url(#shine)" stroke-width="3"/>
<text x="70" y="283" fill="#e0e7ff" font-family="monospace" font-size="17">FRONTEND ENGINEER</text>
<text x="70" y="313" fill="#a78bfa" font-family="monospace" font-size="15">FULL-STACK / AI ENGINEER</text>
<text x="70" y="355" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Building intelligent products and extraordinary digital experiences.</text>
<text x="70" y="395" fill="#22d3ee" font-family="monospace" font-size="12" letter-spacing="3">SYSTEM ONLINE  //  MADURAI, INDIA</text>

<rect x="35" y="35" width="1130" height="360" rx="15" fill="none" stroke="#8b5cf6" stroke-opacity=".5"/>
</svg>
